# This gets dropped in .github/workflows/security-gates.yml
name: Security Gates

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (default LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run repo quality gates (only if scripts exist)
        run: |
          node -e "const p=require('./package.json'); const s=p.scripts||{}; const run=(n)=>{ if(s[n]){ console.log('Running:', n); process.exitCode=0; } else { console.log('Skipping (missing script):', n); } }; run('typecheck'); run('lint'); run('build');"
          if node -e "const p=require('./package.json'); process.exit(!(p.scripts&&p.scripts.typecheck));"; then npm run typecheck; fi
          if node -e "const p=require('./package.json'); process.exit(!(p.scripts&&p.scripts.lint));"; then npm run lint; fi
          if node -e "const p=require('./package.json'); process.exit(!(p.scripts&&p.scripts.build));"; then npm run build; fi

      - name: Dependency vulnerability check (high severity+)
        run: |
          # Keep this lightweight: fail on high/critical.
          npm audit --audit-level=high

      - name: Block obvious dangerous artifacts (executables/scripts)
        run: |
          set -e
          BAD_FILES=$(find . -type f \( \
            -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.pkg" -o \
            -name "*.bat" -o -name "*.ps1" -o -name "*.scr" -o -name "*.jar" \
          \) \
          -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./.next/*" -not -path "./dist/*" -not -path "./build/*" || true)

          if [ -n "$BAD_FILES" ]; then
            echo "Blocked: executable/script artifacts found in repo:"
            echo "$BAD_FILES"
            exit 1
          fi

      - name: Flag suspicious code patterns (fail-fast)
        run: |
          set -e
          # This is intentionally blunt: it catches obvious malware-like behavior.
          # If it ever false-positives, we adjust patterns or scope.
          scan() {
            PATTERN="$1"
            LABEL="$2"
            if grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude-dir=dist --exclude-dir=build \
              -E "$PATTERN" . >/dev/null 2>&1; then
              echo "Blocked suspicious pattern ($LABEL): $PATTERN"
              grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude-dir=dist --exclude-dir=build \
                -E "$PATTERN" . | head -n 50
              exit 1
            fi
          }

          scan "eval\s*\(" "eval()"
          scan "new\s+Function\s*\(" "new Function()"
          scan "document\.write\s*\(" "document.write()"
          scan "child_process|execSync|spawnSync" "node child_process execution"
          scan "powershell|cmd\.exe|wget\s|curl\s" "command execution strings"
          scan "download\s*=" "HTML download attribute"
